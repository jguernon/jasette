[package]
name = "jasette"
version = "1.0.1"
authors = ["Jonathan Guernon"]
edition = "2024"
description = "Jasette : Google Messages (SMS + RCS) sur le bureau, en EGA, avec GPUI"
license = "AGPL-3.0-or-later"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
gpui = { package = "gpui-pre", version = "=0.3.14" }
gpui-component = "0.11.0"
# La sélection du texte des bulles (src/selection.rs) : déjà dans l'arbre par gpui-component.
gpui-base = "0.11.0"
gpui-kit-assets = "0.11.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["wayland", "x11", "font-kit"] }
qrcode = { version = "0.14", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# L'icône des groupes automatiques en image de notification (src/boite_groupes.rs) : déjà dans l'arbre par gpui.
resvg = { version = "0.46", default-features = false }
# Client du serveur Jasette (src/distant.rs) : déjà dans l'arbre par gpui.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ring = "0.17"
base64 = "0.22"
# Aperçus de liens sans serveur Jasette (src/apercu.rs) : rustls, sans OpenSSL.
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
# La mise à jour dans l'app (src/maj.rs) : lire l'archive .tar.gz (déjà dans l'arbre par ureq).
flate2 = "1"
# Les sons des conversations (src/sons.rs) : mp3 (symphonia) joués par cpal (ALSA). MIT ou Apache-2.0.
rodio = { version = "0.23", default-features = false, features = ["playback", "mp3"] }
# « Ce que j'écoute » (src/musique.rs) : lire Spotify par MPRIS sur D-Bus (déjà dans l'arbre par gpui).
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }

# Windows seulement (src/windows.rs) : ShellExecuteW, SetStdHandle, l'AppUserModelID.
# La même version que celle déjà dans Cargo.lock (rien ne change pour Linux).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# macOS seulement : les shaders Metal compilés au lancement (pas besoin de
# l'outil « metal » de Xcode, la Metal Toolchain, pour compiler).
[target.'cfg(target_os = "macos")'.dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.14", features = ["runtime_shaders"] }
