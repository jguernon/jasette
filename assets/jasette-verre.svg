<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <path id="tuile" d="M156 40H356C440 40 472 72 472 156V356C472 440 440 472 356 472H156C72 472 40 440 40 356V156C40 72 72 40 156 40Z"/>
    <path id="bulleAvant" d="M184 104H252A100 100 0 0 1 352 204V218A100 100 0 0 1 252 318H204C184 340 150 362 110 377Q88 385 95 365C103 342 84 318 84 290V204A100 100 0 0 1 184 104Z"/>
    <path id="bulleArriere" d="M294 196H334A98 98 0 0 1 432 294V300C432 338 434 370 443 396Q449 414 431 409C404 401 382 392 362 392H294A98 98 0 0 1 196 294A98 98 0 0 1 294 196Z"/>

    <linearGradient id="gTuile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f84f6"/>
      <stop offset="0.55" stop-color="#5563ee"/>
      <stop offset="1" stop-color="#7146e6"/>
    </linearGradient>
    <radialGradient id="gLueurTeal" cx="0.18" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#6fe0e0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6fe0e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gLueurPeche" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#ffa878" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffa878" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gReflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gBord" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="gArriere" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#a8fbef"/>
      <stop offset="1" stop-color="#20bccb"/>
    </linearGradient>
    <linearGradient id="gArriereRefr" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fd2dc"/>
      <stop offset="1" stop-color="#1a8fb5"/>
    </linearGradient>
    <linearGradient id="gAvant" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e8edff" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="gSpec" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <filter id="fOmbreTuile" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="fOmbreBulle" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <filter id="fOmbreProche" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="cTuile"><use href="#tuile"/></clipPath>
    <clipPath id="cAvant"><use href="#bulleAvant"/></clipPath>
    <clipPath id="cArriere"><use href="#bulleArriere"/></clipPath>
  </defs>

  <!-- ombre portée de la tuile -->
  <use href="#tuile" transform="translate(0 10)" fill="#1b1442" opacity="0.35" filter="url(#fOmbreTuile)"/>

  <!-- tuile -->
  <use href="#tuile" fill="url(#gTuile)"/>
  <g clip-path="url(#cTuile)">
    <rect width="512" height="512" fill="url(#gLueurTeal)"/>
    <rect width="512" height="512" fill="url(#gLueurPeche)"/>
    <rect width="512" height="260" fill="url(#gReflet)"/>

    <!-- ombres des bulles sur la tuile -->
    <use href="#bulleArriere" transform="translate(4 14)" fill="#1a1055" opacity="0.35" filter="url(#fOmbreBulle)"/>
    <use href="#bulleAvant" transform="translate(4 14)" fill="#1a1055" opacity="0.35" filter="url(#fOmbreBulle)"/>
  </g>
  <use href="#tuile" fill="none" stroke="url(#gBord)" stroke-width="3" transform="translate(256 256) scale(0.9935) translate(-256 -256)"/>

  <!-- bulle arrière (teal) -->
  <use href="#bulleArriere" fill="url(#gArriere)"/>
  <g clip-path="url(#cArriere)">
    <ellipse cx="314" cy="192" rx="135" ry="50" fill="url(#gSpec)" opacity="0.55"/>
    <!-- ombre de la bulle avant sur l'arrière -->
    <use href="#bulleAvant" transform="translate(5 8)" fill="#0b3560" opacity="0.55" filter="url(#fOmbreProche)"/>
  </g>
  <use href="#bulleArriere" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="3"/>

  <!-- bulle avant (verre givré) -->
  <g clip-path="url(#cAvant)">
    <!-- réfraction : l'arrière vu à travers le verre, décalé et plus saturé -->
    <use href="#bulleArriere" transform="translate(-8 -6)" fill="url(#gArriereRefr)" opacity="0.7"/>
  </g>
  <use href="#bulleAvant" fill="url(#gAvant)"/>
  <g clip-path="url(#cAvant)">
    <ellipse cx="218" cy="100" rx="150" ry="52" fill="url(#gSpec)" opacity="0.9"/>
  </g>
  <use href="#bulleAvant" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="3"/>

  <!-- trois points : plusieurs comptes -->
  <circle cx="154" cy="211" r="23" fill="#3b82f6"/>
  <circle cx="218" cy="211" r="23" fill="#8b5cf6"/>
  <circle cx="282" cy="211" r="23" fill="#ff9a66"/>
</svg>
