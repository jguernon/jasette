# Jasette iOS — le projet Xcode est généré par XcodeGen (ios/construire.sh) :
# Jasette.xcodeproj n'est pas dans git.
name: Jasette
options:
  bundleIdPrefix: ca.jasette
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    # Remplacés par construire.sh : version de Cargo.toml, nombre de commits.
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Jasette:
    type: application
    platform: iOS
    sources:
      - path: Jasette
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.jasette.ios
        PRODUCT_NAME: Jasette
        INFOPLIST_FILE: Jasette/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
        # Aucune identité : signature ad hoc au simulateur, .ipa non signé
        # (AltStore / SideStore re-signent eux-mêmes).
        CODE_SIGN_IDENTITY: "-"
